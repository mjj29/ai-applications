# Archery shot-analysis pipeline configuration.
# Copy/edit per session or per archer. Paths are relative to the project root.

input:
  # Glob(s) for the raw "end" videos (one file = one end of ~6 arrows).
  videos:
    - "PXL_*.mp4"
  fps: null              # null = read from file metadata; set to override if wrong

archer:
  # Multiple people may be in frame. Which one is "the archer"?
  #   nearest - largest body in frame (outdoors, you closest to the camera)
  #   spot    - whoever's torso centre is inside `spot` (indoors: fixed shooting position, archers
  #             take turns; people behind the line / on other targets are ignored).
  # Sessions set this per session in <session>/session.yaml via `archery.cli spot`.
  select: nearest        # nearest | spot
  spot: null             # [x0, y0, x1, y1] fractions of the frame (0..1) the torso centre must be in
  spot_margin: 0.25      # grow the spot by this fraction of its size on each side (landmark noise)
  handedness: right      # right-handed draws with the right hand (= release hand)

pose:
  model: models/pose_landmarker_heavy.task
  hand_model: models/hand_landmarker.task
  num_poses: 4           # detect up to N people per frame, then pick per archer.select
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  delegate: cpu          # cpu | gpu. GPU is ~2.6x faster here but the Intel Arc GPU
                         # delegate corrupts landmarks (median 13px / p95 194px vs CPU),
                         # so CPU is the trustworthy default for analysis.
  sample_stride: 1       # process every Nth frame. 1 = full 60fps (best release precision)
  sample_fps: null       # or: a target rate (e.g. 15), whatever the footage's frame rate; overrides sample_stride
  crop_to_spot: false    # run pose only on a band around the shooting spot (needs archer.select: spot);
  crop_margin: 1.0       # ...that band reaches this many spot-widths either side (room for the bow arm)

hands:                   # stage 1b: 21-landmark hand detail (draw/bow hands)
  enabled: true
  num_hands: 4           # detect up to N hands per frame, then associate to your wrists
  min_detection_confidence: 0.4
  min_tracking_confidence: 0.4

segment:
  # A real shot = a SUSTAINED hold at full draw. Wind let-downs raise the bow but never
  # hold at the top, so they're rejected by the high-threshold + minimum-hold rule.
  activity_signal: bow_wrist_height   # bow_wrist_height | hand_separation
  activity_high_threshold: 0.8        # bow hand must exceed this fraction of its range...
  min_hold_s: 1.5                     # ...for at least this long to count as a shot (vs a let-down)
  max_gap_bridge_s: 2.0               # no archer tracked for longer than this = bow down (stepped off the spot)
  draw_start_threshold: 0.25          # bow-hand height below this (walking back from full draw) = draw start
  expected_shots: 6                   # sanity check (an "end" is usually 6 arrows)
  # NOTE: tuned for a clicker archer who holds. A snap-shooter would need a lower
  # min_hold_s; tune against the output/<video>.segment.png diagnostic plot.
  # Release = release-hand backward snap near the hold's falling edge, cross-checked
  # against the clicker/shot audio transient.
  use_audio_clicker: true
  require_audio: true                # drop holds with no matching clicker/shot transient.
                                      # true = cleaner (every real clicker shot clicks) but
                                      # risks dropping a real shot if its audio match fails.
  relative_hold_min: 0.5              # drop holds shorter than this x the end's median hold (raises/let-downs)
  relative_onset_min: 0.4             # a click weaker than this x the end's median confirming click
                                      # isn't this archer's (neighbours' clickers indoors)
  onset_highpass_hz: 1500             # high-pass before onset detection (suppress wind/voices)
  release_pre_s: 1.5                  # search for the snap this long before the hold's falling edge
  release_post_s: 0.5                 # ...and this long after
  release_search_window_s: 1.0        # match audio onsets within this of the pose release
  release_snap_to_audio: true         # move the release onto the strongest onset in the window below:
  release_snap_pre_s: 0.8             # ...from this long before the pose release (pose tends to run late)
  release_snap_post_s: 0.1            # ...to this long after it
  release_from_bow_motion: true       # no audio track: time the loose by the bow jumping forward
  release_motion_after_s: 2.0         # ...looking up to this long past the end of the hold
                                      # (12 hand-checked silent shots: within 0.17s, mean -0.01s)
  audio_latency_s: 0.0              # the crack is heard this long after the loose (~0.12 on a Pixel;
                                      # a constant offset doesn't affect alignment between shots)
  # Clips start before the HOLD begins (adapts to variable hold length) so the raise +
  # draw into full draw is captured, not just the release.
  clip_lead_s: 3.0                    # seconds kept before the hold starts (raise + draw)
  clip_pad_post_s: 2.0                # seconds kept after release (follow-through)
  clip_preset: fast                   # x264 preset for the shot clips (ultrafast..slow)
  clip_crf: 18                        # x264 quality (lower = better/bigger)
  clip_max_height: null               # downscale clips to at most this many pixels high (null = source)

normalize:
  anchor: hip_center     # body landmark pinned to the origin each frame
  scale_by: torso        # normalize size by torso (shoulder->hip) length
  align_time_on: release # t = 0 is the release frame for every shot
  align_pre_s: 5.0       # keep this many seconds before release (covers draw + hold)
  align_post_s: 1.0      # ...and this many after (release + follow-through)
  grid_fps: 60           # resample rate of the common time grid
  rotate_upright: false  # rotate spine vertical? off = preserve lean as a real difference
  min_visibility: 0.5    # drop landmarks below this confidence, then gap-fill
  smooth_frames: 7       # temporal median filter window (frames) to remove glitch spikes
  warp_variable_phase: dtw   # dtw | none — time-warp the variable draw/aim phase (stage 5)

compare:
  reference: mean        # compare each shot to the mean trajectory, or an integer shot index
  score_window: [-0.5, 0.1]  # rank shot differences over this time-from-release window
                             # (focus on the release; the follow-through diverges naturally)
  joints:                # joints / angles to track, overlay, and plot
    - draw_elbow_angle
    - bow_shoulder_angle
    - draw_wrist_path
    - bow_wrist_path
    - head_position
    - spine_tilt
  highlight_threshold_std: 2.0   # flag deviations beyond N std from the reference

ghost:                   # stage 5b: translucent overlay of real frames, body-aligned
  fps: 20                # frames/s of the ghost/delta video
  width: 720             # canvas size (px) - landscape suits the spread draw posture
  height: 560
  target_torso: 150      # body scaled so torso = this many canvas px (bigger = tighter crop)
  hip_y_frac: 0.62       # vertical position of the hips on the canvas

timeline:                # time axis for ghost + delta animations
  mode: phase            # phase = warp draw, then show the SHORTER shot's hold in full (cut
                         #         the longer shot's static middle to match), then warp the
                         #         follow-through -- draw, hold, release and bow-down all stay
                         #         in step; at most the longer shot loses (only static aim).
                         # release = plain real time aligned only on release.
  draw_s: 1.5            # display seconds for the (time-warped) draw phase
  max_hold_s: 3.0        # cap on the hold shown (shorter shot's hold is shown in full up to this)
  follow_s: 1.0          # display seconds for the (time-warped) follow-through to bow-down
  fps: 24                # sampling resolution of the timeline
  slow_factor: 2.0       # playback slowdown (output video fps = fps / slow_factor; 2 = half speed)

output:
  dir: output
  data_dir: data
  overlay_video: true
  trajectory_plots: true

watch:                   # `watch` command (in-session processing)
  # Folder your recorder saves into (e.g. 'C:/Users/me/Videos/Captures' or
  # 'C:/Users/me/Pictures/Camera Roll'). When set, each NEW recording there is identified by
  # the appearance of whoever is on the shooting spot and moved into <session>/<pseudonym>/.
  # Files already there when watching starts are left alone (`sort` files those).
  # null = save recordings into the archer folders yourself.
  incoming: null
  interval_s: 10         # seconds between folder scans
  settle_s: 15           # a file must be unchanged this long (recording finished) before use

identify:                # telling archers apart (archery/identify.py)
  model: models/pose_landmarker_full.task
  match_threshold: 0.42  # appearance distance below this = same archer. Measured on outdoor
                         # footage: same person 0.15-0.30 (0.57 after a big sun/exposure change),
                         # different people >= 0.49. Raise if one archer keeps splitting into two
                         # pseudonyms; lower if two archers get merged. `who` shows the distances.
  sample_every_s: 2      # look at who's on the spot this often through each recording
  split_turns: true      # archers take turns within one recording: cut it into one end per turn
  turn_chunk_s: 6        # appearance is compared in chunks this long...
  min_turn_s: 20         # ...and a "turn" shorter than this is someone walking past

# Named overlays applied on top of everything else (`watch` uses fast; `session --fast` too).
# Measured on an Intel Core Ultra 5 laptop CPU, 1080p60 footage: the heavy model runs at
# ~0.14x real time (a 2.5-min end takes ~18 min); fast runs at ~0.7x (~3.5 min) with the
# landmarks ~2x noisier -- good enough to see the shape of each end during the session,
# then re-run `session` (full) afterwards for the numbers you'd act on.
# On the i7-10510U capture laptop (2:18 of 1080p60 VP9): the old fast settings (every 2nd frame,
# num_poses 4, full-size clips) took 35 min; these take ~4 min (pose ~2 min). Release times come
# from the audio snap (segment.release_snap_to_audio), so 15fps pose loses no release precision.
profiles:
  fast:
    pose:
      model: models/pose_landmarker_full.task
      sample_fps: 15       # pose at 15fps whatever the footage's rate (lite model saves only ~20%)
      num_poses: 1         # track one person (several times faster than re-detecting up to 4) ...
      crop_to_spot: true   # ... and crop to the shooting spot so that one person is the archer
    segment:
      clip_preset: veryfast
      clip_crf: 23
      clip_max_height: 720
    hands:
      enabled: false       # hand detail roughly doubles the time; skip it for previews
